<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Spring</title>
    <!-- 반응형 -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <!-- select2 CDN -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />    
	<!-- summernote css -->
	<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.js"></script>
	<link th:href="@{/css/external/summernote/summernote-lite.css}" rel="stylesheet">
	
    <!-- reset css -->
	<link th:href="@{/css/common/admin/fragments/reset.css}" rel="stylesheet">
	<!-- menu css -->
	<link th:href="@{/css/common/admin/fragments/menu.css}" rel="stylesheet">
	<!-- header css -->
	<link th:href="@{/css/common/admin/fragments/header.css}" rel="stylesheet">
	
	<!-- admin notice css -->
	<link th:href="@{/css/view/admin/sub/notice.css}" rel="stylesheet">
	<!-- admin noticeWrite css -->
	<link th:href="@{/css/view/admin/sub/noticeWrite.css}" rel="stylesheet">
	<!-- admin noticeDetails css -->
	<link th:href="@{/css/view/admin/sub/noticeDetails.css}" rel="stylesheet">
</head>
<body>
	
	<div style="display: flex;">
		<div th:replace="~{common/admin/fragments/menu::menu}" class="menu"></div> <!-- 메뉴 -->
		<div style="display: flex; flex-direction: column;">
			<div th:replace="~{common/admin/fragments/header::header}"></div>
	        <div layout:fragment="content" class="content"></div> <!-- 콘텐츠 -->
	    </div>
	</div>
</body>
</html>
