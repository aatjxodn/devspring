<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/admin/layout/layout}">

	<div layout:fragment="content">
	
		<!-- noticeWrite 영역 -->
		<div class="noticeWrite-layout">
			<div class="noticeWrite-con">
			
				<!-- 상단 영역 -->
				<div class="noticeWrite-filter-layout">
					<!-- 제목 영역 -->
					<div class="noticeWrite-filter-search-box">
						<input type="text" id="noticeWrite-search" placeholder="제목을 입력하세요.">
					</div>
					
					<!-- 버튼 영역 -->
					<div class="noticeWrite-filter-button-box">
						<div class="noticeWrite-filter-back">돌아가기</div>
						<div class="noticeWrite-filter-insert">등록</div>
					</div>
				</div>
				
				<!-- 중단 영역 -->
				<div class="noticeWrite-content-layout">
				    <textarea class="form-control" id="noticeWrite-summernote" name="content" type="text"></textarea>
				</div>
				
				<div class="noticeWrite-file-layout">
					<div>
						<button id="noticeWrite-file-insert" type="button">파일 목록</button>
						<input id="noticeWrite-file" multiple="multiple" type="file" style="display: none;">
					</div>
					<div>
						<div class="noticeWrite-file-list"></div>
						<!-- <div class="butCl">전송</div> -->
					</div>
				</div>
				
			</div>
		</div>
	
		<!-- admin noticeWrite js -->
		<script type="text/javascript" th:src="@{/js/view/admin/sub/noticeWrite.js}"></script>
		<script type="text/javascript" th:src="@{/js/external/summernote/lang/summernote-ko-KR.js}"></script>
		<script type="text/javascript" th:src="@{/js/external/summernote/summernote-lite.js}"></script>
	
	</div>

</html>
